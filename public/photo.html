<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真 - About Me</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Gridギャラリー：スマホで最低3列表示にする */
        .gallery {
            display: grid;
            /* デスクトップでは自動フィット。最低幅を120pxにして余白で調整 */
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            justify-items: center;
            align-items: start;
        }

        .gallery img {
            width: 100%;
            /* 正方形に近い表示 */
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        /* スマホ表示: 最低3列を保証（幅に応じて小さくなる） */
        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* モーダル用 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div class="nav-back">
        <a href="index.html">← Back to Top</a>
    </div>

    <header class="page-header">
        <div class="header-bg" style="background-image: url('assets/images/photo/1.jpg');"></div>
        <h1 class="page-title">写真</h1>
    </header>

    <main class="article-content">
        <div class="container-sm">
            <div class="text-body">
                <p>
                    僕は写真を撮るのが好きで、旅行などで県外とかに行った際は必ず写真を撮っています。<br><br>
                    スマホで頑張って撮ってます。<br><br>
                    このホームページの写真は全て自分で撮ったものです。<br><br><br><br>
                    一眼レフが欲しいですね。<br><br>
                    写真をタップすると拡大します。<br><br>

                </p>
            </div>
        </div>
    </main>

    <div class="gallery" id="gallery" style="margin: 40px auto; max-width: 1200px; padding: 0 20px;">
        <!-- JSでランダム表示 -->
    </div>

    <!-- モーダル -->
    <div id="modal" class="modal">
        <img id="modal-img" src="" alt="拡大画像">
    </div>

    <script>
        const totalPhotos = 58; // 写真の枚数
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');

        // サムネと元画像の配列
        const photos = [];
        for (let i = 1; i <= totalPhotos; i++) {
            photos.push({
                thumb: `assets/images/samune/${i}.jpg`,
                full: `assets/images/photo/${i}.jpg`
            });
        }

        // 配列をシャッフル
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const shuffled = shuffle(photos);

        // ギャラリーに表示
        shuffled.forEach((p, index) => {
            const img = document.createElement('img');
            img.src = p.thumb;
            img.alt = `写真${index + 1}`;
            img.loading = "lazy";

            // クリックでモーダル表示
            img.addEventListener('click', () => {
                modalImg.src = p.full;
                modal.style.display = 'flex';
            });

            gallery.appendChild(img);
        });

        // モーダルクリックで閉じる
        modal.addEventListener('click', () => {
            modal.style.display = 'none';
        });
    </script>

    <script src="assets/js/script.js"></script>

    <footer>
        <p>© 2025 All rights reserved.</p>
    </footer>
</body>

</html>
